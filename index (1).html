<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Karine Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="top">
    <div class="brand">
      <h1>Karine Studio</h1>
    </div>
    <span style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;">agenda &amp; organização</span>
    <div class="subline" id="headerSub"></div>
    <svg class="scallop" viewBox="0 0 400 14" preserveAspectRatio="none">
      <path d="M0,0 Q10,14 20,0 T40,0 T60,0 T80,0 T100,0 T120,0 T140,0 T160,0 T180,0 T200,0 T220,0 T240,0 T260,0 T280,0 T300,0 T320,0 T340,0 T360,0 T380,0 T400,0 L400,0 L0,0 Z" fill="#FDF4F7"/>
    </svg>
  </header>

  <main id="main"></main>

  <div class="fab">
    <button class="fab-btn" id="fabBtn">+</button>
  </div>

  <nav class="bottom">
    <button data-tab="inicio" class="active">
      <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg></span>
      Início
    </button>
    <button data-tab="agenda">
      <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>
      Agenda
    </button>
    <button data-tab="clientes">
      <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>
      Clientes
    </button>
    <button data-tab="financeiro">
      <span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M6 21V10M12 21V4M18 21v-7"/></svg></span>
      Financeiro
    </button>
  </nav>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheetContent"></div></div>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
